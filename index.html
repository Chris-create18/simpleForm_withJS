<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BASTA SIMPLE FORM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Simple Form Card</h1>
        <p>Please enter your Information Below Thank you!!</p>
      </header>

      <main>
        <!-- User Input Form -->
        <section class="form-card">
          <h2>Personal Information</h2>

          <form id="userForm">
            <!-- Full Name -->
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
              />
            </div>

            <!-- Email Address -->
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="sample@gmail.com" />
            </div>

            <!-- Age -->
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" placeholder="Enter your age" />
            </div>

            <!--  Gender -->
            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>

            <!-- Birthday -->
            <div class="form-group">
              <label for="birthday">Birthday</label>
              <input type="date" id="birthday" />
            </div>

            <!--  Contact Number -->
            <div class="form-group">
              <label for="contact">Contact Number</label>
              <input
                type="tel"
                id="contact"
                placeholder="Enter your contact number"
              />
            </div>

            <!--  Address -->
            <div class="form-group">
              <label for="address">Address</label>
              <input
                type="text"
                id="address"
                placeholder="Enter your address"
              />
            </div>

            <!--  Course -->
            <div class="form-group">
              <label for="course">Course</label>
              <input type="text" id="course" placeholder="Enter your course" />
            </div>

            <!-- Year Level -->
            <div class="form-group">
              <label>Year Level</label>

              <div class="year-options">
                <label>
                  <input type="radio" name="yearLevel" value="1st Year" />
                  1st Year
                </label>

                <label>
                  <input type="radio" name="yearLevel" value="2nd Year" />
                  2nd Year
                </label>

                <label>
                  <input type="radio" name="yearLevel" value="3rd Year" />
                  3rd Year
                </label>

                <label>
                  <input type="radio" name="yearLevel" value="4th Year" />
                  4th Year
                </label>
              </div>
            </div>

            <!-- Favorite Color -->
            <div class="form-group">
              <label>Favorite Color</label>
              <div class="color-options">
                <label>
                  <input type="radio" name="favoriteColor" value="Pink" />
                  Pink
                </label>
                <label>
                  <input type="radio" name="favoriteColor" value="Blue" />
                  Blue
                </label>
                <label>
                  <input type="radio" name="favoriteColor" value="Green" />
                  Green
                </label>
                <label>
                  <input type="radio" name="favoriteColor" value="Yellow" />
                  Yellow
                </label>
              </div>
            </div>

            <!-- Favorite Hobby -->
            <div class="form-group">
              <label>Favorite Hobby</label>

              <div class="hobby-options">
                <label>
                  <input type="checkbox" name="favoriteHobby" value="Biking" />
                  Biking
                </label>

                <label>
                  <input
                    type="checkbox"
                    name="favoriteHobby"
                    value="Playing Music"
                  />
                  Playing Music
                </label>

                <label>
                  <input type="checkbox" name="favoriteHobby" value="Gaming" />
                  Gaming
                </label>

                <label>
                  <input type="checkbox" name="favoriteHobby" value="Sports" />
                  Sports
                </label>
              </div>
            </div>

            <!-- Show My Info Button -->
            <button type="button" id="showInfo">Show My Info</button>
          </form>
        </section>

        <!-- Output Display -->
        <section class="output-card">
          <h2>Your Information</h2>
          <p class="subtitle">Your information will appear here.</p>

          <div id="output" class="output">
            <p class="empty-message">
              Fill out the form and click "Show My Info".
            </p>
          </div>
        </section>
      </main>
    </div>

    <script src="form.js" defer></script>
  </body>
</html>
